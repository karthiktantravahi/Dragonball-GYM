<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gymGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b44" />
      <stop offset="100%" stop-color="#cc0812" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Hexagon shield outline -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#0c0c10" stroke="url(#gymGrad)" stroke-width="4" filter="url(#glow)"/>
  <!-- Inner geometric accents -->
  <polygon points="50,12 84,30 84,70 50,88 16,70 16,30" fill="#141419" stroke="#ff1e27" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Stylized Dragon / Power Flames & 'D' + 'B' emblem -->
  <path d="M50 20 L66 44 H55 L65 72 L34 48 H46 L36 28 Z" fill="url(#gymGrad)"/>
  <!-- Star accents -->
  <polygon points="50,23 52,29 58,29 53,33 55,39 50,35 45,39 47,33 42,29 48,29" fill="#ffffff" />
</svg>
